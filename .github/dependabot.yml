# Weekly dependency updates, grouped so CI runs a few times a week, not
# once per package. Each group is one PR: minor and patch updates together,
# majors on their own (they're the ones that break things). CI decides, and
# the human merges; a merge to main deploys.
# Security advisories open their own PRs as soon as they're published, if
# "Dependabot security updates" is on (repo Settings → Code security).
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Europe/Stockholm }
    open-pull-requests-limit: 3
    groups:
      backend-minor-patch: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Europe/Stockholm }
    open-pull-requests-limit: 3
    groups:
      frontend-minor-patch: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /blackbox-tests
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      blackbox-all: { patterns: ["*"] }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      actions-all: { patterns: ["*"] }
