name: Black-box tests

# Builds the actual repo-root docker-compose.yml stack (db + backend-api +
# backend-agent + frontend, from source — not the GHCR images
# docker-publish.yml ships) and runs blackbox-tests/ against it through
# nginx, exactly as a real client would hit it. See blackbox-tests/README.md
# for what's covered and why BASE_URL points at the frontend's port rather
# than backend-api's.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blackbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # live-feed.test.js needs the global WebSocket client

      - name: Build and start the stack
        run: docker compose up -d --build --wait

      - name: Reopen the poll window
        # Bounded-polling change: the window auto-opens for
        # poll-window-seconds on boot, but `--wait` above can eat into that
        # waiting on healthchecks. Restart it right before testing so
        # live-feed.test.js's optional real-frame check gets a full window
        # instead of racing an already-closing one.
        run: curl -sf -X POST http://localhost:8080/api/agents/restart

      - name: Run the black-box suite
        env:
          BASE_URL: http://localhost:5173
        run: node --test 'blackbox-tests/**/*.test.js'

      - name: Dump container logs
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
