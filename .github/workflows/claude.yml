name: Claude

# @claude in an issue, PR comment or review runs Claude Code on a GitHub
# runner (docs/cloud-agents.md). It can push a branch and open a PR, but
# main is still protected by review: nothing here merges or deploys.
#
# Auth: CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`) bills the
# Claude subscription, not the cloud-session credit.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Only the repo owner can trigger a run: the token bills their plan.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && github.event.review.author_association == 'OWNER') ||
      (github.event_name == 'issues' && contains(format('{0} {1}', github.event.issue.title, github.event.issue.body), '@claude') && github.event.issue.author_association == 'OWNER')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on the PR
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Same toolchain as build-deploy.yml, so Claude can run the real tests.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 60
            --allowedTools "Bash(npm *),Bash(npx *),Bash(mvn *),Bash(node *),Bash(git *),Bash(gh pr *),Bash(curl -fsS http://127.0.0.1*),Edit,Write,Read,Glob,Grep"
