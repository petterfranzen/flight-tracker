# Mirrors the /api and /ws proxy rules from vite.config.ts's dev server,
# but pointed at the "backend" service name on the compose network instead
# of localhost:8080.
server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # LiveFeedBroadcaster only ever sends when a new position lands —
        # no ping/keepalive of its own — so nginx's 60s default read
        # timeout would silently drop an idle-but-healthy connection
        # during any quiet stretch with no traffic in the bounding box.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
