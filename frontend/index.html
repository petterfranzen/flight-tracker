<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flight Tracker</title>
    <!-- Sets the theme attribute before any stylesheet paints, so a
         stored "cyberpunk" preference never flashes the default theme
         for a frame on load. Synchronous and blocking on purpose — must
         run before the CSS below is applied. Duplicates theme.ts's
         loadTheme()/applyTheme() logic because it runs before any JS
         module is available to import from; keep both in sync. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("flighttracker:theme") === "cyberpunk") {
            document.documentElement.dataset.theme = "cyberpunk";
          }
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Cyberpunk theme's display/body/data faces. Harmless to load
         unconditionally: this stylesheet only defines @font-face rules,
         and browsers fetch the actual font files lazily, only once a
         matching font-family is actually used by matched content — the
         default theme never references these names, so it costs
         default-theme users nothing. Preconnecting to both hosts lets the
         DNS/TLS handshake for the (still lazy) font-file fetch overlap
         with everything else loading, instead of starting cold the
         moment cyberpunk theme first needs a glyph. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
