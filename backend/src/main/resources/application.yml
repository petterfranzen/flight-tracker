spring:
  application:
    name: flight-tracker
  # No spring.datasource.* here — cloud migration A2 replaces the
  # autoconfigured Postgres DataSource with a hand-built SQLite one (see
  # config/SqliteDataSourceConfig), which backs off Spring Boot's own
  # DataSourceAutoConfiguration entirely. flighttracker.db-path below is
  # what actually configures it.
  sql:
    init:
      mode: always           # runs schema.sql on startup
  lifecycle:
    # Per shutdown phase, and two phases can each use it in full (the
    # scheduler draining in-flight @Scheduled runs, then the web server
    # draining in-flight requests), so 2 x 10s plus the WebSocket close and
    # JVM exit stays under the systemd unit's TimeoutStopSec=30.
    timeout-per-shutdown-phase: 10s
  task:
    scheduling:
      # No shutdown.await-termination on purpose: Spring's default already
      # lets in-flight runs finish and starts no new ones, and that setting
      # would undo it. See config/SchedulingShutdownConfig.
      pool:
        # AgentOrchestrator's pollAll() (every poll-interval-seconds) and
        # pollGlobalSweep() (every global-sweep-interval-seconds, ~13k
        # worldwide aircraft) are both @Scheduled methods. Spring Boot's
        # default here is a single-threaded scheduler — meaning without
        # this, every @Scheduled method in the process shares one thread,
        # and a slow sweep (observed live: ~14 minutes, since
        # PositionPersistenceService.persist() does several unbatched DB
        # round-trips per report) completely blocks the hot poll for its
        # entire duration. That looked from the outside like OpenSky
        # throttling the whole agent; it was actually this app's own
        # scheduler being monopolized by itself.
        #
        # Since the cloud-migration consolidation (one process, no more
        # api/agent/estimator split) every @Scheduled method in the app
        # shares this one pool, so the count below is every one of them:
        # AgentOrchestrator's two (pollAll, pollGlobalSweep),
        # PositionRetentionService's two (prune, nightlyOptimize — cloud
        # migration A2's PRAGMA optimize pass), EstimatorAgent.refresh(),
        # AirportSeedService.sync(), LiveFeedBroadcaster.sendKeepalive()
        # (the WebSocket ping) and CallsignRouteService.resolveNext() (the
        # paced callsign->route lookups) — eight — plus one spare so a single
        # slow/stuck task never leaves the pool fully saturated. Bump this
        # again if a ninth @Scheduled method is ever added. Retention and
        # the estimator refresh in particular must not have to wait on a
        # sweep for a thread: retention's first run after a long outage
        # walks a real backlog, and the estimator needs to keep running on
        # its own short interval — sharing a thread would put either
        # directly behind the hot poll, which is the exact stall this pool
        # exists to prevent. The keepalive ping needs a thread available on
        # its own fixed 30s cadence too, for the same reason WS connections
        # would otherwise silently die under Cloudflare's ~100s idle
        # timeout during exactly the kind of long sweep that used to
        # starve everything else.
        size: 9

server:
  port: 8080
  # Stop accepting connections and let in-flight requests finish on a
  # restart; see spring.lifecycle above for the time budget.
  shutdown: graceful
  # Cloud migration: this process now sits behind a Cloudflare Tunnel
  # (cloudflared), which connects to it over loopback only — nothing should
  # ever need this bound to a non-loopback interface. Overridable (e.g. for
  # local debugging from another machine on the LAN) via SERVER_ADDRESS.
  address: ${SERVER_ADDRESS:127.0.0.1}

flighttracker:
  # SQLite database file (cloud migration A2 — see config/SqliteDataSourceConfig).
  # Parent directory is created if missing. ./data/flighttracker.db by
  # default — deploy.sh/the systemd unit set FLIGHTTRACKER_DB_PATH to a
  # path under the service's real StateDirectory in production.
  db-path: ${FLIGHTTRACKER_DB_PATH:./data/flighttracker.db}
  # Rolling retention for flight_position — see PositionRetentionService,
  # which is also where the reasoning for pruning *only* that table lives.
  retention:
    # Cloud migration A2: 24h -> 72h. The predicting agent (EstimatedPositionService's
    # dead-reckoning) doesn't need deeper history than this to work — it
    # only ever looks at an aircraft's *last* real report — but the app
    # increasingly wants to show/derive multi-day patterns (the frontend's
    # own track trace, /api/usage) now that SQLite's per-row storage cost
    # is cheap enough (a local file, not a NAS-hosted Postgres instance
    # paying replication/backup overhead per byte retained) that 3 days of
    # headroom costs little and buys real flexibility.
    hours: 72
    # Rows per transaction. Small enough that a batch never holds the
    # single SQLite writer lock for long (PLAN.md's own "SQLite rules that
    # bite": busy_timeout=5000 covers realistic overlap, not an indefinite
    # wait), large enough that steady-state clears in a handful of round-trips.
    batch-size: 5000
    interval-ms: 600000
    # One cycle's grace on startup so retention never competes with schema
    # init or the agent's first poll for a connection.
    initial-delay-ms: 60000
    # Caps a single run at ~1M rows so the first pass over a long-accumulated
    # backlog makes steady progress across cycles instead of monopolising a
    # scheduler thread for an hour.
    max-batches-per-run: 200
  persistence:
    # Cloud migration A2 (PLAN.md §6 item 7): skips inserting an on_ground
    # report whose lat/lon/heading exactly match the aircraft's last
    # *stored* report — a parked aircraft's global-sweep hits otherwise
    # write an identical row every global-sweep-interval-seconds (360s)
    # for as long as it sits at the gate, pure write amplification with no
    # new information (see PositionPersistenceService.persist/persistBatch
    # for where this is applied). Airborne reports always insert
    # regardless — a moving aircraft's position is never truly unchanged,
    # and usage/distance calculations need every real sample. See
    # UsageService's own javadoc for why this is safe for that calc
    # specifically: a skipped duplicate-ground report contributes a
    # haversine distance of 0 either way, whether it's a real row or
    # simply absent.
    skip-unchanged-ground: true
  agents:
    # Each entry becomes one polling agent. Point this at whatever live
    # flight-data source you have access to (OpenSky Network's free REST
    # API is the easiest to start with — no key needed for anonymous,
    # rate-limited use).
    #
    # "Hot" poll (poll() — bbox is whatever ViewportService currently
    # reports, i.e. whichever map viewport a client last asked for; see
    # FlightController.live and viewport_state in schema.sql):
    poll-interval-seconds: 18
    # Polling auto-stops this long after each start/restart — 5 minutes of
    # 18s hot polling, then it falls back to riding on the always-on
    # global-sweep-interval-seconds sweep below until reopened — so an
    # unattended NAS deployment doesn't run 24/7 and burn through OpenSky's
    # credit budget. Matched to the frontend's own DIALOG_STOP_MS
    # (FlightMap.tsx) — the point at which a genuinely idle-but-still-open
    # tab stops being treated as "someone's watching" and the ResumeDialog
    # appears — so the backend keeps hot-polling for exactly as long as the
    # frontend is quietly fetching on its behalf, no longer. Reopened
    # automatically on page load if it isn't already active (see
    # FlightMap.tsx's mount effect — a page load while a session is
    # already live takes no action) or via the ResumeDialog's "Resume
    # tracking" button — each reopen grants another 5 minutes, up to
    # hot-poll-seconds-per-ip-per-day (see the rate-limit block below) of
    # hot polling per caller per day; POST /api/agents/restart directly
    # works too, if you'd rather script it.
    poll-window-seconds: 300
    # Hard global cap on hot-poll HTTP calls (poll-interval-seconds cadence)
    # across all callers combined, per rolling 24h — see PollWindowService.
    # hotPollBudgetAvailable/recordHotPollCall and AgentOrchestrator.
    # pollAll(). Once reached, hot polling stops entirely (regardless of
    # any still-open poll window or per-IP allowance left) for the rest of
    # that 24h period, falling back to global-sweep-interval-seconds'
    # always-on sweep alone — a second, independent backstop on top of
    # poll-window-seconds and the per-IP daily cap, sized for the shared
    # OpenSky budget rather than for any one caller's behavior. At the
    # default 18s cadence, 3000 calls is 15 hours of continuous hot
    # polling per day — comfortably above realistic usage, there purely as
    # a hard ceiling.
    hot-poll-daily-call-budget: 3000
    # Hard cap on how many times POST /api/agents/restart can reopen the
    # poll window within restart-quota-window-minutes — see
    # PollWindowService.restart(). This app being internet-facing means
    # this bounds worst-case OpenSky usage from *anyone* hammering restart
    # directly, not just the frontend's own honest calls. This one is a
    # short-window throttle (it resets every 15 minutes, so on its own it
    # doesn't bound a whole day) — hot-poll-daily-call-budget above and
    # hot-poll-seconds-per-ip-per-day below are what actually keep total
    # usage bounded day to day, globally and per caller respectively; this
    # one just stops any single burst of restart calls from being able to
    # pin the window open indefinitely inside one short window.
    restart-quota-max: 3
    restart-quota-window-minutes: 15
    # Global sweep (pollGlobal() — no bbox, every aircraft worldwide):
    # always on, independent of the poll window above — see
    # AgentOrchestrator.pollGlobalSweep. A full-world states/all call costs
    # meaningfully more of OpenSky's per-account credit budget than a
    # bbox-scoped one; on the free anonymous tier this can plausibly burn
    # through the daily budget on its own well before the day is out, in
    # which case PollBackoff just skips cycles until it resets — degraded,
    # not broken. A registered OpenSky account (see the oauth block below)
    # has a much larger budget if you want reliable global coverage.
    global-sweep-interval-seconds: 360
    opensky:
      enabled: true
      base-url: https://opensky-network.org/api
      # Origin/destination enrichment needs an authenticated call
      # (anonymous /flights/aircraft returns 403) — register a free
      # OAuth2 client-credentials app at https://opensky-network.org/login
      # and set these via env vars. Left blank, that lookup is skipped
      # and the dossier just shows "—" for origin/destination.
      oauth:
        client-id: ${OPENSKY_CLIENT_ID:}
        client-secret: ${OPENSKY_CLIENT_SECRET:}
        token-url: https://auth.opensky-network.org/auth/realms/opensky-network/protocol/openid-connect/token
  estimator:
    # EstimatorAgent's (SPRING_PROFILES_ACTIVE=estimator) refresh cadence —
    # how often it recomputes and persists a dead-reckoned position for
    # every live aircraft. Was 12s (the old in-memory EstimatedPositionCache's
    # hardcoded constant, carried over when this got externalized) - raised
    # to 30s after diagnosing real NAS write-amplification (459GB written
    # against ~1GB of actual table data): every cycle rewrites
    # estimated_latitude/estimated_longitude for every live aircraft, and
    # those columns feed an expression index, so each write is a full
    # B-tree update, not just a heap write. 30s cuts that cycle count by
    # more than half with no meaningfully worse dead-reckoning freshness -
    # see EstimatorAgent.refresh() for the other half of this fix (skipping
    # writes that would just re-set an already-null estimate to null).
    refresh-interval-seconds: 30
  # Per-client-IP limits on POST /api/agents/restart specifically — the one
  # endpoint that costs real OpenSky usage. Separate from (and in addition
  # to) the global restart-quota-* above: that one protects the shared
  # OpenSky budget no matter who's asking; this one stops a single caller
  # from being the reason the shared quota gets exhausted, and catches
  # sustained abuse spread out *across* a day specifically to dodge the
  # 15-minute quota window. See RestartRateLimiter. Loopback/private-range
  # callers (localhost, and — deliberately — anyone on the same LAN as a
  # home/NAS deployment) are exempt *only* when trust-local is true; see
  # ClientIpResolver.isLocal and trust-local directly below.
  rate-limit:
    # Cloud migration security fix (PLAN.md §6 item 7): in production every
    # request now arrives from cloudflared (the Cloudflare Tunnel daemon)
    # on 127.0.0.1 — there's no nginx/docker-compose bridge network setting
    # X-Real-IP to a real per-visitor address any more. With the
    # local-network exemption left on, every visitor's resolved IP would
    # look like a loopback address and every single one of them would be
    # exempt from every rate limit on this page, defeating the point of
    # having them. False in production (the default, and what deploy.sh's
    # generated environment sets); TRUST_LOCAL=true is for running this
    # backend directly against a local Postgres for development, where
    # every caller genuinely is local.
    trust-local: ${TRUST_LOCAL:false}
    restart-per-ip-per-minute: 3
    restart-per-ip-per-day: 20
    # Separate from restart-per-ip-per-day above, which counts *requests*:
    # this counts granted hot-poll *seconds* per IP per rolling 24h, so it
    # actually bounds "how long has this caller had hot polling running",
    # not just "how many times did they ask". At poll-window-seconds=300,
    # 4500 is 15 grants (check-ins) a day — sized off the global
    # hot-poll-daily-call-budget above having plenty of headroom to spare
    # even for several such users at once: concurrent users don't multiply
    # calls (they share one poll window/cycle — see AgentOrchestrator.
    # pollAll and the mount effect in FlightMap.tsx, which only restarts an
    # already-closed window), so this is sized per-caller against realistic
    # daily check-in counts, not against the shared budget directly. See
    # HotPollUserBudget, wired into AgentController.restart(). Also exempt
    # for local/private-range callers, same as the limits above.
    hot-poll-seconds-per-ip-per-day: 4500
