// /etc/apt/apt.conf.d/52unattended-upgrades-local
// Ubuntu's unattended-upgrades only installs updates from Ubuntu's own
// archives by default. cloudflared comes from Cloudflare's apt repo
// (Origin/Label "cloudflared"), so without this it is never patched.
Unattended-Upgrade::Origins-Pattern {
        "origin=cloudflared,label=cloudflared";
};
// Updates that need a reboot (kernel, libc) take effect at a quiet hour.
// The app and the tunnel are systemd units enabled at boot, so the site is
// back by itself within a minute or two.
Unattended-Upgrade::Automatic-Reboot "true";
Unattended-Upgrade::Automatic-Reboot-Time "04:30";
// A long-running process keeps executing the old binary after its package is
// upgraded. After each dpkg run, restart the units whose binary is newer than
// the running process (see restart-if-upgraded).
DPkg::Post-Invoke { "/usr/local/sbin/restart-if-upgraded || true"; };
