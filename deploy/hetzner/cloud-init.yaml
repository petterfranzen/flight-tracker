#cloud-config
# Hetzner Cloud user data for the flight-tracker VM (Ubuntu 24.04, CX23).
# GENERATED by deploy/hetzner/build-cloud-init.sh from the files next to it;
# edit those, then regenerate. Replace the two <...> placeholders before use.

package_update: true
package_upgrade: true
packages:
  - openjdk-21-jre-headless
  - sqlite3
  - jq
  - curl
  - ufw
  - unattended-upgrades

users:
  - name: petter
    groups: [sudo]
    shell: /bin/bash
    lock_passwd: true
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys:
      - "<YOUR PERSONAL SSH PUBLIC KEY>"
  - name: deploy
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - 'command="/opt/flight-tracker/bin/deploy.sh",restrict <GITHUB DEPLOY PUBLIC KEY>'
  - name: flighttracker
    system: true
    shell: /usr/sbin/nologin

write_files:
  - path: /etc/ssh/sshd_config.d/10-hardening.conf
    permissions: "0644"
    content: |
      # /etc/ssh/sshd_config.d/10-hardening.conf
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      AllowUsers petter deploy
      X11Forwarding no
  - path: /etc/sudoers.d/flight-tracker-deploy
    permissions: "0440"
    content: |
      # /etc/sudoers.d/flight-tracker-deploy  (mode 0440)
      # The deploy user may restart and check the status of the app, nothing else.
      deploy ALL=(root) NOPASSWD: /usr/bin/systemctl restart flight-tracker, /usr/bin/systemctl status flight-tracker
  - path: /etc/systemd/system/flight-tracker.service
    permissions: "0644"
    content: |
      # /etc/systemd/system/flight-tracker.service
      # Single JVM: REST + WebSocket + static SPA + pollers + SQLite.
      # Listens on 127.0.0.1:8080 only; cloudflared is the sole way in.
      [Unit]
      Description=Flight tracker
      After=network-online.target
      Wants=network-online.target
      # Stays inactive until the first deploy has installed a jar.
      ConditionPathExists=/opt/flight-tracker/app/current.jar

      [Service]
      Type=simple
      User=flighttracker
      Group=flighttracker
      StateDirectory=flight-tracker
      StateDirectoryMode=0750
      WorkingDirectory=/var/lib/flight-tracker
      EnvironmentFile=/etc/flight-tracker/env
      Environment=FLIGHTTRACKER_DB_PATH=/var/lib/flight-tracker/flighttracker.db
      Environment=SERVER_ADDRESS=127.0.0.1
      Environment=SERVER_PORT=8080
      Environment=TRUST_LOCAL=false
      ExecStart=/usr/bin/java -Xms256m -Xmx768m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError \
          -jar /opt/flight-tracker/app/current.jar
      SuccessExitStatus=143
      TimeoutStopSec=30
      Restart=on-failure
      RestartSec=5

      # Memory: 768 MB heap + ~300 MB JVM overhead; SQLite page cache is reclaimable.
      MemoryHigh=1400M
      MemoryMax=1800M

      # Hardening. No MemoryDenyWriteExecute: the JIT needs W+X pages.
      NoNewPrivileges=yes
      ProtectSystem=strict
      ProtectHome=yes
      PrivateTmp=yes
      PrivateDevices=yes
      ProtectKernelTunables=yes
      ProtectKernelModules=yes
      ProtectKernelLogs=yes
      ProtectControlGroups=yes
      ProtectClock=yes
      ProtectHostname=yes
      RestrictSUIDSGID=yes
      RestrictRealtime=yes
      RestrictNamespaces=yes
      LockPersonality=yes
      CapabilityBoundingSet=
      AmbientCapabilities=
      SystemCallArchitectures=native
      RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX

      [Install]
      WantedBy=multi-user.target
  - path: /opt/flight-tracker/bin/deploy.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Forced command for the CI deploy key (see authorized_keys in cloud-init.yaml).
      # The deploy key can run nothing but this script, and SSH_ORIGINAL_COMMAND is
      # treated as hostile input.
      #
      #   ssh flight "deploy <40-char git sha> <sha256 of jar>" < flight-tracker.jar
      #   ssh flight "rollback"
      #   ssh flight "status"
      #
      # Exit codes: 0 ok · 1 error · 2 new release unhealthy, rolled back ·
      #             3 rollback target unhealthy too (site is down, investigate) · 64 usage
      set -euo pipefail
      umask 022

      # FT_* overrides exist only for deploy/hetzner/test/run.sh. They are safe in
      # production because sshd does not pass client-supplied environment variables
      # (no PermitUserEnvironment, and AcceptEnv only covers LANG/LC_*).
      APP_DIR="${FT_APP_DIR:-/opt/flight-tracker/app}"
      RELEASES="$APP_DIR/releases"
      CURRENT="$APP_DIR/current.jar"
      PREVIOUS="$APP_DIR/previous.jar"
      SERVICE=flight-tracker
      HEALTH_URL="${FT_HEALTH_URL:-http://127.0.0.1:8080/api/health}"
      HEALTH_TIMEOUT_S="${FT_HEALTH_TIMEOUT_S:-90}"
      MAX_JAR_BYTES="${FT_MAX_JAR_BYTES:-$((200 * 1024 * 1024))}"
      KEEP_RELEASES=5

      log() { printf '%s %s\n' "$(date -u +%FT%TZ)" "$*"; }
      die() { log "ERROR: $1" >&2; exit "${2:-1}"; }
      usage() { die "usage: deploy <git-sha> <sha256> | rollback | status" 64; }

      restart_service() {
        if [[ -n "${FT_RESTART_CMD:-}" ]]; then "$FT_RESTART_CMD"; else sudo -n /usr/bin/systemctl restart "$SERVICE"; fi
      }

      # deploy's sudo grant covers exactly these two systemctl subcommands (see
      # sudoers-deploy) — restart to install a release, status so `ssh flight
      # status` can report real unit state, not just the symlinks/health guess.
      status_service() {
        if [[ -n "${FT_STATUS_CMD:-}" ]]; then "$FT_STATUS_CMD"
        else sudo -n /usr/bin/systemctl status "$SERVICE" --no-pager || true
        fi
      }

      sha_of_link() { basename "$(readlink -f "$1")" .jar; }

      # Waits until /api/health reports status UP and the expected version.
      wait_healthy() {
        local want="$1" deadline=$((SECONDS + HEALTH_TIMEOUT_S)) body
        while (( SECONDS < deadline )); do
          if body=$(curl -fsS --max-time 3 "$HEALTH_URL" 2>/dev/null) &&
             jq -e --arg v "$want" '.status == "UP" and .version == $v' >/dev/null <<<"$body"; then
            log "healthy: $body"
            return 0
          fi
          sleep 3
        done
        log "not healthy after ${HEALTH_TIMEOUT_S}s (last response: ${body:-none})"
        return 1
      }

      # Atomically points $1 (a symlink path) at $2.
      relink() {
        local link="$1" target="$2" tmp
        tmp="$(dirname "$link")/.$(basename "$link").tmp"
        ln -sfn "$target" "$tmp"
        # Plain `mv -f`, not GNU's `mv -Tf`: -T only changes behaviour when the
        # destination is a symlink to a *directory* (treat it as a file to
        # overwrite instead of a directory to move into), which $link never is
        # here (it always points at a release jar) — so the portable form does the
        # same atomic rename on both the Ubuntu target and a macOS dev box.
        mv -f "$tmp" "$link"
      }

      prune_releases() {
        local keep_current keep_previous f
        keep_current="$(readlink -f "$CURRENT" 2>/dev/null || true)"
        keep_previous="$(readlink -f "$PREVIOUS" 2>/dev/null || true)"
        # Newest-mtime-first, skip the newest KEEP_RELEASES and anything still
        # linked. `ls -t` (POSIX-ish, and what `previous`/`current` themselves rely
        # on for ordering), not `find -printf` + sort (GNU-only): keeps this
        # runnable with /usr/bin/find on a macOS dev box, same behaviour on the
        # Ubuntu target. Release counts here are always small (single digits).
        # shellcheck disable=SC2012 # release filenames are always <40-hex-sha>.jar
        # (validated in cmd_deploy), never anything `ls` output-parsing could misread
        while IFS= read -r f; do
          [[ -z "$f" ]] && continue
          [[ "$f" == "$keep_current" || "$f" == "$keep_previous" ]] && continue
          rm -f -- "$f" && log "pruned $(basename "$f")"
        done < <(cd "$RELEASES" && ls -1t -- *.jar 2>/dev/null | tail -n +$((KEEP_RELEASES + 1)) | sed "s#^#$RELEASES/#")
      }

      cmd_deploy() {
        local sha="$1" sum="$2" tmp size prev="" old_previous=""
        [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || die "git sha must be 40 lowercase hex chars" 64
        [[ "$sum" =~ ^[0-9a-f]{64}$ ]] || die "sha256 must be 64 lowercase hex chars" 64

        tmp="$(mktemp "$RELEASES/.incoming.XXXXXX")"
        trap 'rm -f -- "$tmp"' EXIT

        # Read at most MAX+1 bytes so an oversized upload is detected, not truncated.
        head -c $((MAX_JAR_BYTES + 1)) > "$tmp"
        # wc -c (POSIX), not `stat -c %s` (GNU-only): keeps this runnable with
        # /usr/bin/stat on a macOS dev box, same output on the Ubuntu target.
        size=$(wc -c < "$tmp" | tr -d ' ')
        (( size > 0 )) || die "no jar received on stdin"
        (( size <= MAX_JAR_BYTES )) || die "jar exceeds ${MAX_JAR_BYTES} bytes"
        printf '%s  %s\n' "$sum" "$tmp" | sha256sum -c --quiet - || die "checksum mismatch"

        mv -f -- "$tmp" "$RELEASES/$sha.jar"
        trap - EXIT
        chmod 0644 "$RELEASES/$sha.jar"
        log "received $sha ($size bytes), checksum ok"

        if [[ -L "$CURRENT" ]]; then
          prev="$(readlink -f "$CURRENT")"
        fi
        if [[ -L "$PREVIOUS" ]]; then
          old_previous="$(readlink -f "$PREVIOUS")"
        fi
        if [[ -n "$prev" && "$prev" != "$RELEASES/$sha.jar" ]]; then
          relink "$PREVIOUS" "$prev"
        fi
        relink "$CURRENT" "$RELEASES/$sha.jar"

        log "restarting $SERVICE on $sha"
        restart_service
        if wait_healthy "$sha"; then
          prune_releases
          log "deployed $sha"
          return 0
        fi

        if [[ -z "$prev" || "$prev" == "$RELEASES/$sha.jar" ]]; then
          die "release $sha unhealthy and there is no previous release to roll back to" 3
        fi
        log "rolling back to $(basename "$prev" .jar)"
        relink "$CURRENT" "$prev"
        # Put "previous" back too, so a later `rollback` doesn't target the release
        # that is running right now.
        if [[ -n "$old_previous" ]]; then relink "$PREVIOUS" "$old_previous"; else rm -f -- "$PREVIOUS"; fi
        restart_service
        wait_healthy "$(basename "$prev" .jar)" || die "rollback target is unhealthy too" 3
        die "release $sha was unhealthy; rolled back to $(basename "$prev" .jar)" 2
      }

      cmd_rollback() {
        [[ -L "$PREVIOUS" ]] || die "no previous release recorded"
        local cur prev
        cur="$(readlink -f "$CURRENT")"
        prev="$(readlink -f "$PREVIOUS")"
        relink "$CURRENT" "$prev"
        relink "$PREVIOUS" "$cur"
        restart_service
        wait_healthy "$(sha_of_link "$CURRENT")" || die "rolled-back release is unhealthy" 3
        log "rolled back to $(sha_of_link "$CURRENT")"
      }

      cmd_status() {
        local link label
        for label in current previous; do
          link="$APP_DIR/$label.jar"
          if [[ -L "$link" ]]; then log "$label: $(sha_of_link "$link")"; else log "$label: none"; fi
        done
        curl -fsS --max-time 3 "$HEALTH_URL" || log "health endpoint not answering"
        echo
        status_service
      }

      main() {
        local -a args=()
        read -r -a args <<< "${SSH_ORIGINAL_COMMAND:-}" || true
        case "${#args[@]}:${args[0]:-}" in
          3:deploy)   cmd_deploy "${args[1]}" "${args[2]}" ;;
          1:rollback) cmd_rollback ;;
          1:status)   cmd_status ;;
          *)          usage ;;
        esac
      }

      main
  - path: /etc/flight-tracker/env
    permissions: "0640"
    owner: root:flighttracker
    defer: true
    content: |
      # /etc/flight-tracker/env  (owner root:flighttracker, mode 0640)
      # OpenSky OAuth2 client-credentials app (opensky-network.org → Account → API client).
      OPENSKY_CLIENT_ID=
      OPENSKY_CLIENT_SECRET=
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

runcmd:
  # App directories: bin/ is root-owned so the deploy user can't replace deploy.sh.
  - install -d -o root -g root -m 0755 /opt/flight-tracker /opt/flight-tracker/bin
  - install -d -o deploy -g deploy -m 0755 /opt/flight-tracker/app /opt/flight-tracker/app/releases
  # cloudflared from Cloudflare's apt repo (the tunnel token is added by hand later).
  - install -d -m 0755 /usr/share/keyrings
  - curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg -o /usr/share/keyrings/cloudflare-main.gpg
  - echo 'deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main' > /etc/apt/sources.list.d/cloudflared.list
  - apt-get update && apt-get install -y cloudflared
  # Host firewall. Port 22 is open only for bootstrap; the guide removes it once
  # SSH through Cloudflare Access works.
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp comment 'bootstrap only, remove after Access SSH works'
  - ufw --force enable
  - systemctl daemon-reload
  - systemctl enable flight-tracker
  - systemctl restart ssh
