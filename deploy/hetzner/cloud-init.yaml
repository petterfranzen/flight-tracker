#cloud-config
# Hetzner Cloud user data for the flight-tracker VM (Ubuntu 24.04, CX23).
# GENERATED by deploy/hetzner/build-cloud-init.sh from the files next to it;
# edit those, then regenerate. Replace the two <...> placeholders before use.

package_update: true
package_upgrade: true
packages:
  - openjdk-21-jre-headless
  - sqlite3
  - jq
  - curl
  - ufw
  - unattended-upgrades

users:
  - name: petter
    groups: [sudo]
    shell: /bin/bash
    lock_passwd: true
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys:
      - "<YOUR PERSONAL SSH PUBLIC KEY>"
  - name: deploy
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - 'command="/opt/flight-tracker/bin/deploy.sh",restrict <GITHUB DEPLOY PUBLIC KEY>'
  - name: flighttracker
    system: true
    shell: /usr/sbin/nologin

write_files:
  - path: /etc/ssh/sshd_config.d/10-hardening.conf
    permissions: "0644"
    content: |
      # /etc/ssh/sshd_config.d/10-hardening.conf
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      AllowUsers petter deploy
      X11Forwarding no
  - path: /etc/sudoers.d/flight-tracker-deploy
    permissions: "0440"
    content: |
      # /etc/sudoers.d/flight-tracker-deploy  (mode 0440)
      # The deploy user may restart and check the status of the app, nothing else.
      deploy ALL=(root) NOPASSWD: /usr/bin/systemctl restart flight-tracker, /usr/bin/systemctl status flight-tracker
  - path: /etc/systemd/system/flight-tracker.service
    permissions: "0644"
    content: |
      # /etc/systemd/system/flight-tracker.service
      # Single JVM: REST + WebSocket + static SPA + pollers + SQLite.
      # Listens on 127.0.0.1:8080 only; cloudflared is the sole way in.
      [Unit]
      Description=Flight tracker
      After=network-online.target
      Wants=network-online.target
      # Stays inactive until the first deploy has installed a jar.
      ConditionPathExists=/opt/flight-tracker/app/current.jar

      [Service]
      Type=simple
      User=flighttracker
      Group=flighttracker
      StateDirectory=flight-tracker
      StateDirectoryMode=0750
      WorkingDirectory=/var/lib/flight-tracker
      EnvironmentFile=/etc/flight-tracker/env
      Environment=FLIGHTTRACKER_DB_PATH=/var/lib/flight-tracker/flighttracker.db
      Environment=SERVER_ADDRESS=127.0.0.1
      Environment=SERVER_PORT=8080
      Environment=TRUST_LOCAL=false
      # Heap sized to the measured live set (~200 MB) plus headroom; Serial GC
      # because this is a mostly idle single-user app (G1's own structures were
      # ~60 MB). See docs/perf/PROFILE-2026-10.md.
      ExecStart=/usr/bin/java -Xms128m -Xmx384m -XX:+UseSerialGC -XX:ReservedCodeCacheSize=64m -Xss512k \
          -XX:+ExitOnOutOfMemoryError \
          -jar /opt/flight-tracker/app/current.jar
      SuccessExitStatus=143
      TimeoutStopSec=30
      Restart=on-failure
      RestartSec=5

      # Memory: these limits also count the kernel page cache of the database
      # file. The JVM's anonymous memory (heap, metaspace, code, and SQLite's own
      # per-connection page caches on the native heap) must stay well below
      # MemoryHigh, or the cache the database needs is reclaimed and every query
      # reads from disk (measured: ~600 MB anon with the flags above, vs ~1.2 GB
      # and still growing with the old -Xmx768m G1 setup).
      MemoryHigh=1400M
      MemoryMax=1800M

      # Hardening. No MemoryDenyWriteExecute: the JIT needs W+X pages.
      NoNewPrivileges=yes
      ProtectSystem=strict
      ProtectHome=yes
      PrivateTmp=yes
      PrivateDevices=yes
      ProtectKernelTunables=yes
      ProtectKernelModules=yes
      ProtectKernelLogs=yes
      ProtectControlGroups=yes
      ProtectClock=yes
      ProtectHostname=yes
      RestrictSUIDSGID=yes
      RestrictRealtime=yes
      RestrictNamespaces=yes
      LockPersonality=yes
      CapabilityBoundingSet=
      AmbientCapabilities=
      SystemCallArchitectures=native
      RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX

      [Install]
      WantedBy=multi-user.target
  - path: /opt/flight-tracker/bin/deploy.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Forced command for the CI deploy key (see authorized_keys in cloud-init.yaml).
      # The deploy key can run nothing but this script, and SSH_ORIGINAL_COMMAND is
      # treated as hostile input.
      #
      #   ssh flight "deploy <40-char git sha> <sha256 of jar>" < flight-tracker.jar
      #   ssh flight "rollback"
      #   ssh flight "status"
      #
      # Exit codes: 0 ok · 1 error · 2 new release unhealthy, rolled back ·
      #             3 rollback target unhealthy too (site is down, investigate) · 64 usage
      set -euo pipefail
      umask 022

      # FT_* overrides exist only for deploy/hetzner/test/run.sh. They are safe in
      # production because sshd does not pass client-supplied environment variables
      # (no PermitUserEnvironment, and AcceptEnv only covers LANG/LC_*).
      APP_DIR="${FT_APP_DIR:-/opt/flight-tracker/app}"
      RELEASES="$APP_DIR/releases"
      CURRENT="$APP_DIR/current.jar"
      PREVIOUS="$APP_DIR/previous.jar"
      SERVICE=flight-tracker
      HEALTH_URL="${FT_HEALTH_URL:-http://127.0.0.1:8080/api/health}"
      HEALTH_TIMEOUT_S="${FT_HEALTH_TIMEOUT_S:-90}"
      MAX_JAR_BYTES="${FT_MAX_JAR_BYTES:-$((200 * 1024 * 1024))}"
      KEEP_RELEASES=5

      log() { printf '%s %s\n' "$(date -u +%FT%TZ)" "$*"; }
      die() { log "ERROR: $1" >&2; exit "${2:-1}"; }
      usage() { die "usage: deploy <git-sha> <sha256> | rollback | status" 64; }

      restart_service() {
        if [[ -n "${FT_RESTART_CMD:-}" ]]; then "$FT_RESTART_CMD"; else sudo -n /usr/bin/systemctl restart "$SERVICE"; fi
      }

      # deploy's sudo grant covers exactly these two systemctl subcommands (see
      # sudoers-deploy) — restart to install a release, status so `ssh flight
      # status` can report real unit state, not just the symlinks/health guess.
      status_service() {
        if [[ -n "${FT_STATUS_CMD:-}" ]]; then "$FT_STATUS_CMD"
        else sudo -n /usr/bin/systemctl status "$SERVICE" --no-pager || true
        fi
      }

      sha_of_link() { basename "$(readlink -f "$1")" .jar; }

      # Waits until /api/health reports status UP and the expected version.
      wait_healthy() {
        local want="$1" deadline=$((SECONDS + HEALTH_TIMEOUT_S)) body
        while (( SECONDS < deadline )); do
          if body=$(curl -fsS --max-time 3 "$HEALTH_URL" 2>/dev/null) &&
             jq -e --arg v "$want" '.status == "UP" and .version == $v' >/dev/null <<<"$body"; then
            log "healthy: $body"
            return 0
          fi
          sleep 3
        done
        log "not healthy after ${HEALTH_TIMEOUT_S}s (last response: ${body:-none})"
        return 1
      }

      # Atomically points $1 (a symlink path) at $2.
      relink() {
        local link="$1" target="$2" tmp
        tmp="$(dirname "$link")/.$(basename "$link").tmp"
        ln -sfn "$target" "$tmp"
        # Plain `mv -f`, not GNU's `mv -Tf`: -T only changes behaviour when the
        # destination is a symlink to a *directory* (treat it as a file to
        # overwrite instead of a directory to move into), which $link never is
        # here (it always points at a release jar) — so the portable form does the
        # same atomic rename on both the Ubuntu target and a macOS dev box.
        mv -f "$tmp" "$link"
      }

      prune_releases() {
        local keep_current keep_previous f
        keep_current="$(readlink -f "$CURRENT" 2>/dev/null || true)"
        keep_previous="$(readlink -f "$PREVIOUS" 2>/dev/null || true)"
        # Newest-mtime-first, skip the newest KEEP_RELEASES and anything still
        # linked. `ls -t` (POSIX-ish, and what `previous`/`current` themselves rely
        # on for ordering), not `find -printf` + sort (GNU-only): keeps this
        # runnable with /usr/bin/find on a macOS dev box, same behaviour on the
        # Ubuntu target. Release counts here are always small (single digits).
        # shellcheck disable=SC2012 # release filenames are always <40-hex-sha>.jar
        # (validated in cmd_deploy), never anything `ls` output-parsing could misread
        while IFS= read -r f; do
          [[ -z "$f" ]] && continue
          [[ "$f" == "$keep_current" || "$f" == "$keep_previous" ]] && continue
          rm -f -- "$f" && log "pruned $(basename "$f")"
        done < <(cd "$RELEASES" && ls -1t -- *.jar 2>/dev/null | tail -n +$((KEEP_RELEASES + 1)) | sed "s#^#$RELEASES/#")
      }

      cmd_deploy() {
        local sha="$1" sum="$2" tmp size prev="" old_previous=""
        [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || die "git sha must be 40 lowercase hex chars" 64
        [[ "$sum" =~ ^[0-9a-f]{64}$ ]] || die "sha256 must be 64 lowercase hex chars" 64

        tmp="$(mktemp "$RELEASES/.incoming.XXXXXX")"
        trap 'rm -f -- "$tmp"' EXIT

        # Read at most MAX+1 bytes so an oversized upload is detected, not truncated.
        head -c $((MAX_JAR_BYTES + 1)) > "$tmp"
        # wc -c (POSIX), not `stat -c %s` (GNU-only): keeps this runnable with
        # /usr/bin/stat on a macOS dev box, same output on the Ubuntu target.
        size=$(wc -c < "$tmp" | tr -d ' ')
        (( size > 0 )) || die "no jar received on stdin"
        (( size <= MAX_JAR_BYTES )) || die "jar exceeds ${MAX_JAR_BYTES} bytes"
        printf '%s  %s\n' "$sum" "$tmp" | sha256sum -c --quiet - || die "checksum mismatch"

        mv -f -- "$tmp" "$RELEASES/$sha.jar"
        trap - EXIT
        chmod 0644 "$RELEASES/$sha.jar"
        log "received $sha ($size bytes), checksum ok"

        if [[ -L "$CURRENT" ]]; then
          prev="$(readlink -f "$CURRENT")"
        fi
        if [[ -L "$PREVIOUS" ]]; then
          old_previous="$(readlink -f "$PREVIOUS")"
        fi
        if [[ -n "$prev" && "$prev" != "$RELEASES/$sha.jar" ]]; then
          relink "$PREVIOUS" "$prev"
        fi
        relink "$CURRENT" "$RELEASES/$sha.jar"

        log "restarting $SERVICE on $sha"
        restart_service
        if wait_healthy "$sha"; then
          prune_releases
          log "deployed $sha"
          return 0
        fi

        if [[ -z "$prev" || "$prev" == "$RELEASES/$sha.jar" ]]; then
          die "release $sha unhealthy and there is no previous release to roll back to" 3
        fi
        log "rolling back to $(basename "$prev" .jar)"
        relink "$CURRENT" "$prev"
        # Put "previous" back too, so a later `rollback` doesn't target the release
        # that is running right now.
        if [[ -n "$old_previous" ]]; then relink "$PREVIOUS" "$old_previous"; else rm -f -- "$PREVIOUS"; fi
        restart_service
        wait_healthy "$(basename "$prev" .jar)" || die "rollback target is unhealthy too" 3
        die "release $sha was unhealthy; rolled back to $(basename "$prev" .jar)" 2
      }

      cmd_rollback() {
        [[ -L "$PREVIOUS" ]] || die "no previous release recorded"
        local cur prev
        cur="$(readlink -f "$CURRENT")"
        prev="$(readlink -f "$PREVIOUS")"
        relink "$CURRENT" "$prev"
        relink "$PREVIOUS" "$cur"
        restart_service
        wait_healthy "$(sha_of_link "$CURRENT")" || die "rolled-back release is unhealthy" 3
        log "rolled back to $(sha_of_link "$CURRENT")"
      }

      cmd_status() {
        local link label
        for label in current previous; do
          link="$APP_DIR/$label.jar"
          if [[ -L "$link" ]]; then log "$label: $(sha_of_link "$link")"; else log "$label: none"; fi
        done
        curl -fsS --max-time 3 "$HEALTH_URL" || log "health endpoint not answering"
        echo
        status_service
      }

      main() {
        local -a args=()
        read -r -a args <<< "${SSH_ORIGINAL_COMMAND:-}" || true
        case "${#args[@]}:${args[0]:-}" in
          3:deploy)   cmd_deploy "${args[1]}" "${args[2]}" ;;
          1:rollback) cmd_rollback ;;
          1:status)   cmd_status ;;
          *)          usage ;;
        esac
      }

      main
  - path: /etc/flight-tracker/env
    permissions: "0640"
    owner: root:flighttracker
    defer: true
    content: |
      # /etc/flight-tracker/env  (owner root:flighttracker, mode 0640)
      # OpenSky OAuth2 client-credentials app (opensky-network.org → Account → API client).
      OPENSKY_CLIENT_ID=
      OPENSKY_CLIENT_SECRET=

      # Swedavia FlightInfo v2 (arrival confirmation, optional; free tier).
      # Get a key: apideveloper.swedavia.se -> sign up -> subscribe to the FlightInfo product.
      # Without a key the provider stays off. Keys rotate every 6 months: put the other one
      # in the SECONDARY variable so a rotation does not interrupt it.
      # SWEDAVIA_API_KEY=
      # SWEDAVIA_API_KEY_SECONDARY=

      # AeroDataBox (arrival confirmation, optional; free Basic plan). The fallback for airports
      # Swedavia does not cover. Get a key: rapid.aerodatabox.com -> sign up on RapidAPI ->
      # subscribe to the Basic plan (400 units/month, a lookup costs 2) -> copy the X-RapidAPI-Key.
      # Without a key the provider stays off. The free plan is non-commercial and requires
      # attribution (the UI shows the credit link); commercial use needs a paid plan.
      # AERODATABOX_API_KEY=

      # Optional social login (design: section9-hq #84, step 3a). Register one OAuth app
      # per provider, then paste its client id and secret here. A provider with no values
      # stays off: its registration is never built and no sign-in option appears — nothing
      # breaks. The callback URL to register is
      #   <the host the app is served on>/login/oauth2/code/{google,github}
      # (register it after the domain move of #58; design §4 says the registration step is
      # the last one before flipping the flag).
      #   Google: Cloud Console -> APIs & Services -> Credentials -> Create OAuth client ID
      #           -> Web application.
      #   GitHub: Settings -> Developer settings -> OAuth Apps -> New OAuth App.
      # The public base URL the app is reached at (https, behind Cloudflare), used to build
      # the callback URL above. TLS terminates at Cloudflare, so the request the app itself
      # sees is http; without this the callback would be http and the provider would reject
      # it. No trailing slash. Example: https://flight.pastabake.cloud
      # FLIGHTTRACKER_PUBLIC_BASE_URL=
      # GOOGLE_CLIENT_ID=
      # GOOGLE_CLIENT_SECRET=
      # GITHUB_CLIENT_ID=
      # GITHUB_CLIENT_SECRET=

      # HMAC peppers (security audit findings M2/M3, section9-hq #405). Each is a
      # secret this deployment alone holds: generate it here on the box with
      # `openssl rand -base64 32` (32 random bytes, 44 base64 characters) and paste it
      # in — never commit a value, and never reuse one for both. Each must be at least
      # 32 bytes.
      #   FLIGHTTRACKER_SUBJECT_PEPPER keys the profile.subject_hash values (social
      #   login); required before flighttracker.profile.enabled is switched on.
      #   FLIGHTTRACKER_RATE_LIMIT_PEPPER keys the persisted per-client budget rows;
      #   required in production (a prod-profile run refuses to start without it).
      FLIGHTTRACKER_SUBJECT_PEPPER=
      FLIGHTTRACKER_RATE_LIMIT_PEPPER=
  - path: /etc/apt/apt.conf.d/52unattended-upgrades-local
    permissions: "0644"
    content: |
      // /etc/apt/apt.conf.d/52unattended-upgrades-local
      // Ubuntu's unattended-upgrades installs Ubuntu's own updates by default (see
      // 50unattended-upgrades); that default list is left alone here. cloudflared
      // comes from Cloudflare's own apt repo and is held to the house patch rule: a
      // release is installed only once it is 24 h old, so a bad release is caught
      // before it reaches this box (Petter, 16 Nov). cloudflared-patch.sh owns
      // cloudflared upgrades, so unattended-upgrades must not install it.
      // For a major CVE (CVSS 7+ or CISA KEV) lift the delay with
      // `sudo /usr/local/sbin/cloudflared-patch.sh --now`, inside the 72 h bound.
      Unattended-Upgrade::Package-Blacklist {
              "cloudflared";
      };
      // Updates that need a reboot (kernel, libc) take effect at a quiet hour.
      // The app and the tunnel are systemd units enabled at boot, so the site is
      // back by itself within a minute or two.
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:30";
      // A long-running process keeps executing the old binary after its package is
      // upgraded. After each dpkg run, restart the units whose binary is newer than
      // the running process (see restart-if-upgraded). This is also what restarts
      // cloudflared after cloudflared-patch.sh upgrades it.
      DPkg::Post-Invoke { "/usr/local/sbin/restart-if-upgraded || true" };
  - path: /usr/local/sbin/restart-if-upgraded
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # /usr/local/sbin/restart-if-upgraded: called by apt after every dpkg run
      # (unattended-upgrades included, see 52unattended-upgrades-local). Restarts a
      # unit only when its binary on disk is newer than the running process, so an
      # unrelated package upgrade never bounces the tunnel or the app.
      set -uo pipefail

      restart_if_newer() { # unit binary
        local unit="$1" bin started_at bin_mtime
        bin="$(readlink -f "$2" 2>/dev/null)" || return 0
        [[ -x "$bin" ]] || return 0
        systemctl is-active --quiet "$unit" || return 0
        started_at="$(systemctl show "$unit" -p ExecMainStartTimestamp --value)"
        [[ -n "$started_at" ]] || return 0
        started_at="$(date -d "$started_at" +%s 2>/dev/null)" || return 0
        bin_mtime="$(stat -c %Y "$bin")"
        if (( bin_mtime > started_at )); then
          logger -t restart-if-upgraded "restarting $unit: $bin changed after it started"
          systemctl restart "$unit"
        fi
      }

      restart_if_newer cloudflared.service /usr/bin/cloudflared
      restart_if_newer flight-tracker.service /usr/bin/java
  - path: /usr/local/sbin/cloudflared-patch.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Hold cloudflared to the house patch rule (Petter, 16 Nov): a release is
      # installed only once it is 24 h old, so a bad release is caught before it
      # reaches this box. cloudflared comes from Cloudflare's own apt repo, so
      # unattended-upgrades is told to leave it alone (see
      # /etc/apt/apt.conf.d/52unattended-upgrades-local) and this script is the only
      # thing that upgrades it. It records the first time it sees a candidate version
      # and installs that version only once it has been available for
      # FT_CLOUDFLARED_DELAY_H hours (24 by default). Run by
      # flight-tracker-cloudflared-patch.timer; safe to re-run.
      #
      #   cloudflared-patch.sh            enforce the 24 h delay
      #   cloudflared-patch.sh --now      install the candidate now: the CVE fast path
      #                                   (CVSS 7+ or CISA KEV), inside the 72 h bound
      #   cloudflared-patch.sh --dry-run  decide and print the action, change nothing
      #   cloudflared-patch.sh --status   print installed, candidate and age
      #
      # Exit: 0 = up to date, holding, or applied; 1 = apt could not be read or the
      # upgrade failed; 2 = bad usage.
      set -euo pipefail

      PKG=cloudflared
      DELAY=$(( ${FT_CLOUDFLARED_DELAY_H:-24} * 3600 ))
      # Its own state directory, not the app's /var/lib/flight-tracker: that one is
      # flighttracker-owned and 0750 (StateDirectory=flight-tracker), and the
      # `install -d` below would relax it to 0755.
      STATE_DIR=${FT_CLOUDFLARED_STATE_DIR:-/var/lib/flight-tracker-cloudflared}
      STAMP=$STATE_DIR/cloudflared-candidate

      dry=0
      force=0
      status=0
      for arg in "$@"; do
        case "$arg" in
          --dry-run) dry=1 ;;
          --now)     force=1 ;;
          --status)  status=1 ;;
          *) echo "usage: cloudflared-patch.sh [--now] [--dry-run] [--status]" >&2; exit 2 ;;
        esac
      done

      now=$(date +%s)
      installed=$(dpkg-query -W -f='${Version}' "$PKG" 2>/dev/null || true)
      candidate=$(apt-cache policy "$PKG" 2>/dev/null | awk '/Candidate:/{print $2; exit}')

      if [ -z "${candidate:-}" ] || [ "$candidate" = "(none)" ]; then
        echo "cloudflared-patch: no candidate version from apt for $PKG (repo not configured?)" >&2
        exit 1
      fi

      # Seconds since the candidate was first seen, or nothing when it has not been.
      age_of_candidate() {
        [ -f "$STAMP" ] || return 0
        local ver at
        read -r ver at <"$STAMP" || true
        # A stamp for a version apt no longer offers is a superseded candidate, not
        # an error. Returning non-zero here would, under `set -e`, kill the caller
        # before it re-stamps the new candidate, so the hold would wedge forever.
        if [ "${ver:-}" = "$candidate" ] && [ -n "${at:-}" ]; then
          echo "$(( now - at ))"
        fi
        return 0
      }

      if [ "$candidate" = "${installed:-}" ]; then
        # Only a real run clears the stamp; --status and --dry-run change nothing.
        if [ "$status" = 0 ] && [ "$dry" = 0 ]; then rm -f "$STAMP"; fi
        echo "cloudflared-patch: up to date ($installed)"
        exit 0
      fi

      if [ "$status" = 1 ]; then
        age=$(age_of_candidate)
        if [ -n "${age:-}" ]; then
          echo "cloudflared-patch: installed ${installed:-none}, candidate $candidate, seen $(( age / 3600 )) h ago"
        else
          echo "cloudflared-patch: installed ${installed:-none}, candidate $candidate, not yet seen"
        fi
        exit 0
      fi

      if [ "$force" = 0 ]; then
        age=$(age_of_candidate)
        if [ -z "${age:-}" ]; then
          # --dry-run only reports the action; it must not start the 24 h clock.
          if [ "$dry" = 0 ]; then
            install -d -m 0755 "$STATE_DIR"
            printf '%s %s\n' "$candidate" "$now" >"$STAMP"
          fi
          echo "cloudflared-patch: $candidate is new; holding it for $(( DELAY / 3600 )) h"
          exit 0
        fi
        if [ "$age" -lt "$DELAY" ]; then
          echo "cloudflared-patch: holding $candidate; $(( (DELAY - age + 3599) / 3600 )) h to go"
          exit 0
        fi
      fi

      if [ "$dry" = 1 ]; then
        echo "cloudflared-patch: would upgrade ${installed:-none} -> $candidate"
        exit 0
      fi

      echo "cloudflared-patch: upgrading ${installed:-none} -> $candidate"
      DEBIAN_FRONTEND=noninteractive apt-get install -y --only-upgrade "$PKG"
      rm -f "$STAMP"
      echo "cloudflared-patch: upgraded to $candidate"
      # The apt-get above fires DPkg::Post-Invoke -> /usr/local/sbin/restart-if-upgraded,
      # which restarts cloudflared because its binary is now newer than the running
      # process, so the new release goes live without a second restart here.
  - path: /etc/systemd/system/flight-tracker-cloudflared-patch.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Flight tracker patch rule: upgrade cloudflared only once its release is 24 h old
      Documentation=https://github.com/petterfranzen/flight-tracker/blob/main/deploy/hetzner/README.md
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/cloudflared-patch.sh
      TimeoutStartSec=5min
      Nice=10
      # apt and dpkg write across the filesystem, so unlike a read-only unit this one
      # carries no ProtectSystem/ReadOnlyPaths hardening. StateDirectory creates
      # /var/lib/flight-tracker-cloudflared (0755, root-owned) for the first-seen stamp.
      StateDirectory=flight-tracker-cloudflared
  - path: /etc/systemd/system/flight-tracker-cloudflared-patch.timer
    permissions: "0644"
    content: |
      [Unit]
      Description=Flight tracker patch rule: check cloudflared for an aged release, hourly

      [Timer]
      OnBootSec=15min
      OnUnitInactiveSec=1h

      [Install]
      WantedBy=timers.target
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

runcmd:
  # App directories: bin/ is root-owned so the deploy user can't replace deploy.sh.
  - install -d -o root -g root -m 0755 /opt/flight-tracker /opt/flight-tracker/bin
  - install -d -o deploy -g deploy -m 0755 /opt/flight-tracker/app /opt/flight-tracker/app/releases
  # cloudflared from Cloudflare's apt repo (the tunnel token is added by hand later).
  - install -d -m 0755 /usr/share/keyrings
  - curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg -o /usr/share/keyrings/cloudflare-main.gpg
  - echo 'deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main' > /etc/apt/sources.list.d/cloudflared.list
  - apt-get update && apt-get install -y cloudflared
  # Host firewall. Port 22 is open only for bootstrap; the guide removes it once
  # SSH through Cloudflare Access works.
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp comment 'bootstrap only, remove after Access SSH works'
  - ufw --force enable
  - systemctl daemon-reload
  - systemctl enable flight-tracker
  # Patch rule: install cloudflared upgrades only once a release is 24 h old
  # (deploy/hetzner/cloudflared-patch.sh, blacklisted in 52unattended-upgrades-local).
  - systemctl enable --now flight-tracker-cloudflared-patch.timer
  - systemctl restart ssh
