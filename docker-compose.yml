# Five independent services on one bridge network:
#   db           — Postgres, its own image/container/volume, addressed only
#                  by service name (never localhost) so it can be moved to a
#                  managed/clustered instance later by changing
#                  SPRING_DATASOURCE_URL alone. Note: Postgres itself is a
#                  stateful singleton here — `--scale db=N` would just start
#                  N containers pointed at the same volume, which corrupts
#                  data, not a working replica set. Real DB scaling means
#                  read replicas / a managed HA service, swapped in behind
#                  the same connection string.
#   backend-api  — Spring Boot REST + WebSocket, SPRING_PROFILES_ACTIVE=api.
#                  Same image as backend-agent/backend-estimator (one Maven
#                  build, split by Spring profile — see
#                  @Profile("api")/@Profile("agent")/@Profile("estimator")
#                  throughout the backend) rather than separate codebases,
#                  since all three share the same JPA entities/domain code.
#                  Holds no OpenSky credentials — it never calls OpenSky
#                  itself.
#   backend-agent — the scheduled OpenSky poller + enrichment,
#                  SPRING_PROFILES_ACTIVE=agent. No exposed port (headless,
#                  see application-agent.yml) and NOT safe to scale
#                  horizontally as written (`--scale backend-agent=N` is a
#                  bad idea today): each replica runs its own
#                  AgentOrchestrator, so N replicas means N independent
#                  pollers hitting OpenSky and writing to the same table
#                  (multiplying upstream load, though the unique index
#                  prevents duplicate rows). Coordinates with backend-api
#                  only through Postgres — PollWindowService (bounded-polling
#                  state) and LISTEN/NOTIFY (live position feed, see
#                  PositionNotificationListener) — deliberately not a new
#                  broker like Redis, since the data volume here is small.
#   backend-estimator — EstimatorAgent's dead-reckoning refresh loop,
#                  SPRING_PROFILES_ACTIVE=estimator. Also headless, also not
#                  safe to run more than one of (same reasoning as
#                  backend-agent — N replicas would just mean N redundant
#                  writers of the same estimate). Coordinates with the other
#                  two containers purely through the DB (aircraft_latest_
#                  position's estimated_* columns), same as backend-agent —
#                  no direct calls between any of these three.
#   frontend     — static bundle behind nginx, proxying /api and /ws to
#                  backend-api.
#
# Usage:
#   docker compose up --build
#   docker compose up -d --build   # detached
#   docker compose down            # stop (add -v to also drop the db volume)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flighttracker
      POSTGRES_USER: flighttracker
      POSTGRES_PASSWORD: flighttracker
    volumes:
      - db-data:/var/lib/postgresql/data
    # Not published to the host by default — this repo's own README has you
    # install Postgres locally on the standard 5432 for non-Docker
    # development, and that instance would otherwise collide with this one
    # the moment both are running. Services on the compose network still
    # reach this over "db:5432" regardless. Uncomment to reach it from the
    # host (psql, a GUI client, etc.) once you're not also running a local
    # Postgres — or remap to a free port, e.g. "5433:5432".
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flighttracker -d flighttracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-api:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: api
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/flighttracker
      SPRING_DATASOURCE_USERNAME: flighttracker
      SPRING_DATASOURCE_PASSWORD: flighttracker
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      # No actuator dependency in the app, so this just confirms the JVM is
      # up and serving requests through to the database — enough to know
      # nginx won't be proxying to a backend that isn't ready yet.
      #
      # Not --spider: spider mode doesn't read the response body, so wget
      # closes the connection before Spring finishes writing the JSON array
      # — Spring then logs a spurious AsyncRequestNotUsableException
      # ("Connection reset by peer") on every single check. -O /dev/null
      # fully drains the body instead.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/api/flights/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend-agent:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: agent
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/flighttracker
      SPRING_DATASOURCE_USERNAME: flighttracker
      SPRING_DATASOURCE_PASSWORD: flighttracker
      # OpenSky OAuth2 client-credentials app, for the authenticated
      # /flights/aircraft origin/destination fallback lookup. Read from the
      # repo-root .env file (gitignored, not committed) — leave unset to
      # disable that lookup, it degrades to showing "—" in the dossier.
      OPENSKY_CLIENT_ID: ${OPENSKY_CLIENT_ID:-}
      OPENSKY_CLIENT_SECRET: ${OPENSKY_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    # No healthcheck: headless (spring.main.web-application-type: none in
    # application-agent.yml), so there's no port to probe the way
    # backend-api's wget check does. `docker compose ps`/logs are the way
    # to check on it instead.

  backend-estimator:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: estimator
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/flighttracker
      SPRING_DATASOURCE_USERNAME: flighttracker
      SPRING_DATASOURCE_PASSWORD: flighttracker
    depends_on:
      db:
        condition: service_healthy
    # No healthcheck, same reasoning as backend-agent: headless (see
    # application-estimator.yml), nothing to probe over HTTP.

  frontend:
    build: ./frontend
    depends_on:
      backend-api:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  db-data:
